[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-dynasense"
version = "0.1.0"
description = "PRISM-linked transient accident screening and sensitivity analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "PRISM-DynaSense contributors"}]
maintainers = [{name = "Ugwiyeon Lee", email = "lyullee@kgs.or.kr"}]
dependencies = ["prism-risk==0.6.8", "numpy>=2,<3", "scipy>=1.11,<2", "SALib>=1.5,<2", "matplotlib>=3.8,<4", "pydantic>=2.10,<3"]
keywords = ["PRISM", "sensitivity", "transient", "risk", "hydrogen"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["build", "twine"]

[project.scripts]
prism-dynasense = "prism_dynasense.cli:main"

[project.urls]
Repository = "https://github.com/lyullee/prism-dynasense"
Issues = "https://github.com/lyullee/prism-dynasense/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_dynasense = ["data/*.json", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

